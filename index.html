<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #1a1a1e;
      --surface:    #26262d;
      --surface2:   #2f2f38;
      --border:     #3a3a45;
      --accent:     #ff6b35;
      --text:       #f0f0f5;
      --subtext:    #888899;
      --display-bg: #111115;
      --btn-num:    #2a2a32;
      --btn-op2:    #3a3a48;
      --radius:     16px;
      --shadow:     0 20px 60px rgba(0,0,0,0.5);

      --chat-bg:      #0d0d14;
      --chat-surface: #16161f;
      --chat-panel:   #1a1a25;
      --chat-border:  #2a2a3a;
      --chat-accent:  #7c6af7;
      --chat-accent2: #a78bfa;
      --chat-me:      #4f3cdb;
      --chat-them:    #222235;
      --green:        #22c55e;
      --red:          #ef4444;
    }

    html, body {
      height: 100%; width: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; user-select: none;
    }

    /* ─── CALCULATOR ─── */
    #calculator {
      width: 360px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow), 0 0 0 1px var(--border);
      padding: 24px 20px 20px;
      display: flex; flex-direction: column; gap: 16px;
    }
    #calc-display {
      background: var(--display-bg);
      border-radius: 12px; padding: 20px 20px 14px;
      text-align: right; border: 1px solid var(--border);
      min-height: 100px; display: flex; flex-direction: column;
      justify-content: flex-end; gap: 6px;
    }
    #calc-expression { font-family:'Share Tech Mono',monospace; font-size:14px; color:var(--subtext); min-height:20px; }
    #calc-result     { font-family:'Share Tech Mono',monospace; font-size:38px; color:var(--text); letter-spacing:-1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    #calc-buttons { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    .calc-btn {
      height:72px; border:none; border-radius:12px;
      font-family:'Inter',sans-serif; font-size:20px; font-weight:500;
      cursor:pointer; transition:transform 0.08s,filter 0.08s; position:relative; overflow:hidden;
    }
    .calc-btn::after { content:''; position:absolute; inset:0; background:rgba(255,255,255,0); transition:background 0.12s; border-radius:inherit; }
    .calc-btn:active::after { background:rgba(255,255,255,0.12); }
    .calc-btn:active { transform:scale(0.94); }
    .btn-num  { background:var(--btn-num);  color:var(--text); }
    .btn-op   { background:var(--btn-op2);  color:var(--accent); font-weight:600; }
    .btn-fn   { background:var(--surface2); color:var(--subtext); font-size:16px; }
    .btn-eq   { background:var(--accent);   color:#fff; font-weight:700; }
    .btn-zero { grid-column:span 2; }
    .btn-num:hover { background:#333340; }
    .btn-op:hover  { background:#44445a; }
    .btn-fn:hover  { background:#37373f; }
    .btn-eq:hover  { filter:brightness(1.12); }

    /* ─── CHAT OVERLAY ─── */
    #chat-overlay {
      position:fixed; inset:0; background:var(--chat-bg);
      display:none; flex-direction:column; z-index:100;
      animation:fadeIn 0.35s ease;
    }
    #chat-overlay.visible { display:flex; }
    @keyframes fadeIn { from{opacity:0;transform:scale(0.97)} to{opacity:1;transform:scale(1)} }

    /* ─── LOGIN SCREEN ─── */
    #login-screen {
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; height:100%; gap:28px; padding:32px;
    }
    .login-logo {
      width:80px; height:80px;
      background:linear-gradient(135deg,var(--chat-accent),var(--chat-accent2));
      border-radius:24px; display:flex; align-items:center; justify-content:center;
      font-size:40px; box-shadow:0 10px 40px rgba(124,106,247,0.45);
      animation:logoPop 0.5s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes logoPop { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
    .login-title  { font-size:28px; font-weight:700; color:var(--text); letter-spacing:-0.5px; }
    .login-sub    { font-size:13px; color:var(--subtext); text-align:center; line-height:1.7; }

    .user-cards {
      display:flex; gap:14px; width:100%; max-width:340px;
    }
    .user-card {
      flex:1; background:var(--chat-surface); border:2px solid var(--chat-border);
      border-radius:16px; padding:22px 14px; display:flex; flex-direction:column;
      align-items:center; gap:10px; cursor:pointer;
      transition:border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .user-card:hover {
      border-color:var(--chat-accent); transform:translateY(-3px);
      box-shadow:0 8px 30px rgba(124,106,247,0.2);
    }
    .user-card:active { transform:scale(0.97); }
    .user-card .uc-avatar {
      width:52px; height:52px; border-radius:50%;
      display:flex; align-items:center; justify-content:center; font-size:26px;
    }
    .user-card .uc-name  { font-size:16px; font-weight:700; color:var(--text); }
    .user-card .uc-label { font-size:11px; color:var(--subtext); font-weight:500; }

    .back-btn {
      background:var(--chat-surface); color:var(--subtext);
      border:1px solid var(--chat-border); border-radius:10px;
      padding:12px 28px; font-family:'Inter',sans-serif;
      font-size:14px; font-weight:600; cursor:pointer; transition:background 0.15s;
    }
    .back-btn:hover { background:var(--chat-panel); }

    /* ─── CHAT SCREEN ─── */
    #chat-screen { display:none; flex-direction:column; height:100%; }
    #chat-screen.visible { display:flex; }

    #chat-header {
      background:var(--chat-surface); border-bottom:1px solid var(--chat-border);
      padding:13px 18px; display:flex; align-items:center; gap:13px;
    }
    .chat-avatar {
      width:42px; height:42px; border-radius:50%;
      display:flex; align-items:center; justify-content:center; font-size:20px;
      flex-shrink:0;
    }
    .chat-header-info { flex:1; }
    .chat-header-name { font-size:16px; font-weight:700; color:var(--text); }
    .chat-header-sub  { font-size:11px; color:var(--green); display:flex; align-items:center; gap:5px; }
    .chat-header-sub::before { content:''; width:6px; height:6px; background:var(--green); border-radius:50%; display:inline-block; }


    .hdr-close {
      background:none; border:none; color:var(--subtext);
      font-size:20px; cursor:pointer; padding:6px; border-radius:8px;
      transition:background 0.15s,color 0.15s;
    }
    .hdr-close:hover { background:var(--chat-panel); color:var(--red); }

    #messages-area {
      flex:1; overflow-y:auto; padding:18px 16px;
      display:flex; flex-direction:column; gap:10px; scroll-behavior:smooth;
    }
    #messages-area::-webkit-scrollbar { width:4px; }
    #messages-area::-webkit-scrollbar-thumb { background:var(--chat-border); border-radius:2px; }

    .msg-wrap { display:flex; gap:8px; align-items:flex-end; animation:msgIn 0.22s ease; }
    @keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .msg-wrap.me   { flex-direction:row-reverse; }
    .msg-wrap.them { flex-direction:row; }

    .msg-av {
      width:28px; height:28px; border-radius:50%;
      display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;
    }
    .msg-wrap.me   .msg-av { background:var(--chat-me); }
    .msg-wrap.them .msg-av { background:var(--chat-them); border:1px solid var(--chat-border); }

    .msg-col { display:flex; flex-direction:column; gap:3px; max-width:72%; }
    .msg-wrap.me .msg-col { align-items:flex-end; }

    .msg-bubble {
      width:fit-content; max-width:100%; padding:11px 16px; border-radius:18px;
      font-size:15px; line-height:1.6; color:var(--text); word-break:break-word;
      text-align:left;
    }
    .msg-wrap.me   .msg-bubble { background:linear-gradient(135deg,var(--chat-me),#6b3fcf); border-bottom-right-radius:5px; }
    .msg-wrap.them .msg-bubble { background:var(--chat-them); border:1px solid var(--chat-border); border-bottom-left-radius:5px; }

    .msg-time { font-size:10px; color:var(--subtext); }
    .sys-msg  { text-align:center; font-size:12px; color:var(--subtext); padding:4px 0; }

    /* delete button */
    .msg-delete {
      background:none; border:none; cursor:pointer;
      font-size:13px; padding:2px 4px; border-radius:6px;
      color:var(--subtext); opacity:0; pointer-events:none;
      transition:opacity 0.15s, color 0.15s, background 0.15s;
      align-self:flex-end; line-height:1;
    }
    .msg-wrap.me:hover .msg-delete {
      opacity:1; pointer-events:auto;
    }
    .msg-delete:hover { color:var(--red); background:rgba(239,68,68,0.12); }

    /* attach button */
    #attach-btn {
      width:52px; height:52px;
      background:var(--chat-panel); border:1.5px solid var(--chat-border);
      border-radius:14px; color:var(--subtext); font-size:20px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      flex-shrink:0; transition:background 0.15s, color 0.15s, border-color 0.15s;
    }
    #attach-btn:hover { background:var(--chat-surface); color:var(--chat-accent2); border-color:var(--chat-accent); }
    #attach-btn:active { transform:scale(0.93); }

    /* file messages */
    .msg-file-img {
      max-width:100%; max-height:260px; border-radius:12px;
      display:block; cursor:zoom-in; object-fit:cover;
      transition:opacity 0.2s;
    }
    .msg-file-img:hover { opacity:0.88; }
    .msg-file-card {
      display:flex; align-items:center; gap:12px; padding:4px 2px;
    }
    .file-icon { font-size:28px; flex-shrink:0; }
    .file-info { display:flex; flex-direction:column; gap:3px; min-width:0; }
    .file-name { font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px; }
    .file-meta { font-size:11px; color:rgba(255,255,255,0.5); }
    .file-dl {
      font-size:12px; font-weight:600;
      color:var(--chat-accent2); text-decoration:none;
      display:inline-flex; align-items:center; gap:4px; margin-top:2px;
    }
    .file-dl:hover { text-decoration:underline; }

    /* lightbox */
    #lightbox {
      position:fixed; inset:0; background:rgba(0,0,0,0.9);
      display:none; align-items:center; justify-content:center;
      z-index:999; cursor:zoom-out; backdrop-filter:blur(6px);
    }
    #lightbox.open { display:flex; }
    #lightbox img { max-width:92vw; max-height:92vh; border-radius:12px; box-shadow:0 20px 80px rgba(0,0,0,0.8); }

    #chat-input-area {
      background:var(--chat-surface); border-top:1px solid var(--chat-border);
      padding:14px 16px; display:flex; gap:12px; align-items:flex-end;
    }
    #msg-input {
      flex:1; background:var(--chat-panel); border:1.5px solid var(--chat-border);
      border-radius:14px; padding:14px 18px; color:var(--text);
      font-family:'Inter',sans-serif; font-size:15px; outline:none;
      resize:none; max-height:160px; min-height:56px; overflow-y:auto;
      transition:border-color 0.2s, box-shadow 0.2s; line-height:1.6;
    }
    #msg-input:focus {
      border-color:var(--chat-accent);
      box-shadow:0 0 0 3px rgba(124,106,247,0.18);
    }
    #msg-input::placeholder { color:var(--subtext); }

    #send-btn {
      width:52px; height:52px;
      background:linear-gradient(135deg,var(--chat-accent),var(--chat-accent2));
      border:none; border-radius:14px; color:#fff; font-size:20px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      flex-shrink:0; transition:filter 0.15s,transform 0.1s,box-shadow 0.15s;
      box-shadow:0 4px 16px rgba(124,106,247,0.35);
    }
    #send-btn:hover  { filter:brightness(1.12); box-shadow:0 6px 22px rgba(124,106,247,0.5); }
    #send-btn:active { transform:scale(0.93); }


    /* ─── TOAST ─── */
    #toast {
      position:fixed; bottom:26px; left:50%;
      transform:translateX(-50%) translateY(20px);
      background:var(--surface2); color:var(--text); font-size:13px;
      font-weight:500; padding:9px 20px; border-radius:99px;
      border:1px solid var(--border); opacity:0;
      transition:opacity 0.25s,transform 0.25s; pointer-events:none; z-index:999;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ═══════════════ CALCULATOR ═══════════════ -->
<div id="calculator">
  <div id="calc-display">
    <div id="calc-expression"></div>
    <div id="calc-result">0</div>
  </div>
  <div id="calc-buttons">
    <button class="calc-btn btn-fn"  data-action="clear">AC</button>
    <button class="calc-btn btn-fn"  data-action="sign">+/−</button>
    <button class="calc-btn btn-fn"  data-action="percent">%</button>
    <button class="calc-btn btn-op"  data-action="op" data-op="÷">÷</button>
    <button class="calc-btn btn-num" data-action="digit" data-digit="7">7</button>
    <button class="calc-btn btn-num" data-action="digit" data-digit="8">8</button>
    <button class="calc-btn btn-num" data-action="digit" data-digit="9">9</button>
    <button class="calc-btn btn-op"  data-action="op" data-op="×">×</button>
    <button class="calc-btn btn-num" data-action="digit" data-digit="4">4</button>
    <button class="calc-btn btn-num" data-action="digit" data-digit="5">5</button>
    <button class="calc-btn btn-num" data-action="digit" data-digit="6">6</button>
    <button class="calc-btn btn-op"  data-action="op" data-op="−">−</button>
    <button class="calc-btn btn-num" data-action="digit" data-digit="1">1</button>
    <button class="calc-btn btn-num" data-action="digit" data-digit="2">2</button>
    <button class="calc-btn btn-num" data-action="digit" data-digit="3">3</button>
    <button class="calc-btn btn-op"  data-action="op" data-op="+">+</button>
    <button class="calc-btn btn-num btn-zero" data-action="digit" data-digit="0">0</button>
    <button class="calc-btn btn-num" data-action="dot">.</button>
    <button class="calc-btn btn-eq"  data-action="equals">=</button>
  </div>
</div>

<!-- ═══════════════ CHAT OVERLAY ═══════════════ -->
<div id="chat-overlay">

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-logo">👻</div>
    <div style="text-align:center">
      <div class="login-title">Ghost Chat</div>
      <div class="login-sub" style="margin-top:6px">Who are you?</div>
    </div>

    <div class="user-cards">
      <div class="user-card" onclick="loginAs('kinny')" id="card-kinny">
        <div class="uc-avatar" style="background:linear-gradient(135deg,#7c6af7,#a78bfa)">🌙</div>
        <div class="uc-name">Kinny</div>
        <div class="uc-label">Tap to enter</div>
      </div>
      <div class="user-card" onclick="loginAs('cosmic')" id="card-cosmic">
        <div class="uc-avatar" style="background:linear-gradient(135deg,#ff6b35,#ff9a6c)">✨</div>
        <div class="uc-name">Cosmic</div>
        <div class="uc-label">Tap to enter</div>
      </div>
    </div>

    <button class="back-btn" onclick="closeChatOverlay()">← Back to Calculator</button>
  </div>

  <!-- CHAT -->
  <div id="chat-screen">
    <div id="chat-header">
      <div class="chat-avatar" id="peer-avatar">👤</div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="peer-name">—</div>
        <div class="chat-header-sub" id="peer-status">online</div>
      </div>

      <button class="hdr-close" onclick="closeChatOverlay()">✕</button>
    </div>

    <div id="messages-area">
      <div class="sys-msg">🔒 Private chat. Messages auto-erase on logout.</div>
    </div>

    <div id="chat-input-area">
      <input type="file" id="file-input" style="display:none" onchange="handleFileSelect(event)">
      <button id="attach-btn" onclick="document.getElementById('file-input').click()" title="Attach file">📎</button>
      <textarea id="msg-input" placeholder="Type a message…" rows="1" maxlength="1000"></textarea>
      <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>


<div id="lightbox" onclick="this.classList.remove('open')">
  <img id="lightbox-img" src="" alt="">
</div>

<div id="toast"></div>

<script>
/* ════════════════════════════════════════
   CALCULATOR
════════════════════════════════════════ */
const SECRET = '12345';
let cInput='', cResult='0', cOp=null, cPrev=null, cNewNum=false, cExpr='';

const resultEl = document.getElementById('calc-result');
const exprEl   = document.getElementById('calc-expression');

function display(v) {
  resultEl.textContent = v.length > 12 ? parseFloat(v).toExponential(4) : v;
}

document.getElementById('calc-buttons').addEventListener('click', e => {
  const btn = e.target.closest('.calc-btn');
  if (!btn) return;
  const a = btn.dataset.action;

  if (a === 'digit') {
    const d = btn.dataset.digit;
    cInput += d;
    if (cNewNum) { cResult = d; cNewNum = false; }
    else cResult = cResult === '0' ? d : cResult + d;
    display(cResult);
  } else if (a === 'dot') {
    if (!cResult.includes('.')) { cResult += '.'; display(cResult); }
    cInput += '.';
  } else if (a === 'op') {
    if (cOp && !cNewNum) doCalc();
    cPrev = parseFloat(cResult); cOp = btn.dataset.op;
    cNewNum = true; cExpr = cResult + ' ' + cOp;
    exprEl.textContent = cExpr; cInput = '';
  } else if (a === 'equals') {
    checkSecret();
    if (cOp) { cExpr += ' ' + cResult; exprEl.textContent = cExpr; doCalc(); }
    else exprEl.textContent = '';
    cInput = '';
  } else if (a === 'clear') {
    cInput=''; cResult='0'; cOp=null; cPrev=null; cNewNum=false; cExpr='';
    exprEl.textContent=''; display('0');
  } else if (a === 'sign') {
    if (cResult !== '0') { cResult = String(-parseFloat(cResult)); display(cResult); }
  } else if (a === 'percent') {
    cResult = String(parseFloat(cResult) / 100); display(cResult);
  }
});

function doCalc() {
  if (cPrev === null || !cOp) return;
  const cur = parseFloat(cResult); let r;
  if (cOp==='+') r=cPrev+cur; else if (cOp==='−') r=cPrev-cur;
  else if (cOp==='×') r=cPrev*cur;
  else if (cOp==='÷') r = cur!==0 ? cPrev/cur : 'Error';
  cResult = typeof r==='number' ? String(parseFloat(r.toFixed(10))) : r;
  cOp=null; cPrev=null; cNewNum=true;
  display(cResult); exprEl.textContent='';
}

function checkSecret() {
  if (cInput.replace(/[^0-9]/g,'') === SECRET) openChatOverlay();
}

/* ════════════════════════════════════════
   SUPABASE CONFIG
   Replace with your own from:
   Supabase Dashboard → Settings → API
════════════════════════════════════════ */
const SUPABASE_URL  = 'https://goigpzpyvwgriftfnoeg.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvaWdwenB5dndncmlmdGZub2VnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxODcwNDAsImV4cCI6MjEwMjc2MzA0MH0.mQNE1PbK6ZJZZGO9h1r5yiLWp-l1DRaNSFXiBSz0D4U';

let db = null;
const SUPABASE_READY = SUPABASE_URL !== 'YOUR_SUPABASE_URL' && SUPABASE_ANON !== 'YOUR_SUPABASE_ANON_KEY';
try {
  if (SUPABASE_READY && window.supabase) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  }
} catch(e) {
  console.error('Supabase init failed:', e);
}

/* ════════════════════════════════════════
   CHAT
════════════════════════════════════════ */
const USERS = {
  kinny:  { emoji:'🌙', color:'linear-gradient(135deg,#7c6af7,#a78bfa)' },
  cosmic: { emoji:'✨', color:'linear-gradient(135deg,#ff6b35,#ff9a6c)' }
};

let me = null, them = null;
let lastSeen = 0;
let rtChannel = null;

/* ------- open/close ------- */
function openChatOverlay() {
  document.getElementById('chat-overlay').classList.add('visible');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('chat-screen').classList.remove('visible');
}

function closeChatOverlay() {
  document.getElementById('chat-overlay').classList.remove('visible');
  endSession();
}

/* ------- login ------- */
async function loginAs(user) {
  me   = user;
  them = user === 'kinny' ? 'cosmic' : 'kinny';

  const tu = USERS[them];
  document.getElementById('peer-avatar').textContent = tu.emoji;
  document.getElementById('peer-avatar').style.background = tu.color;
  document.getElementById('peer-name').textContent =
    them.charAt(0).toUpperCase() + them.slice(1);

  // Show chat screen immediately — don't wait for DB
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('chat-screen').classList.add('visible');
  document.getElementById('msg-input').focus();

  if (!db) {
    showToast('⚠️ Supabase not configured — add your URL & key to index.html', 5000);
    return;
  }

  await loadMessages();
  subscribeRealtime();
}

/* ------- Supabase: fetch messages ------- */
async function loadMessages() {
  const area = document.getElementById('messages-area');
  area.innerHTML = '<div class="sys-msg">🔒 Private chat. Messages sync in real time.</div>';
  lastSeen = 0;

  const { data, error } = await db
    .from('messages')
    .select('*')
    .order('ts', { ascending: true });

  if (error) { console.error(error); showToast('Failed to load messages'); return; }
  (data || []).forEach(m => renderMsg(m));
  if (data && data.length) lastSeen = data[data.length - 1].ts;
  area.scrollTop = area.scrollHeight;
}

/* ------- Supabase: send message ------- */
async function sendMessage() {
  const el = document.getElementById('msg-input');
  const t  = el.value.trim();
  if (!t || !me) return;
  if (!db) { showToast('⚠️ Add Supabase credentials first'); return; }

  el.value = ''; autoResize(el);

  const { error } = await db.from('messages').insert({
    from: me,
    text: t,
    ts:   Date.now()
  });
  if (error) { showToast('Send failed ✗'); console.error(error); }
}

/* ------- Supabase: delete message ------- */
async function deleteMessage(ts) {
  // animate out immediately
  const el = document.querySelector(`.msg-wrap[data-ts="${ts}"]`);
  if (el) {
    el.style.transition = 'opacity 0.2s, transform 0.2s';
    el.style.opacity = '0';
    el.style.transform = 'scale(0.92)';
  }
  const { error } = await db.from('messages').delete().eq('ts', ts);
  if (error) {
    if (el) { el.style.opacity='1'; el.style.transform=''; }
    showToast('Delete failed ✗');
    return;
  }
  showToast('Message deleted');
}

/* ------- Supabase Realtime subscription ------- */
function subscribeRealtime() {
  if (rtChannel) rtChannel.unsubscribe();

  rtChannel = db.channel('ghost-chat', {
    config: { presence: { key: me } }
  })

  // Live new messages
  .on('postgres_changes', {
    event:  'INSERT',
    schema: 'public',
    table:  'messages'
  }, payload => {
    const m = payload.new;
    if (m.ts > lastSeen) {
      renderMsg(m);
      lastSeen = m.ts;
      const area = document.getElementById('messages-area');
      area.scrollTop = area.scrollHeight;
    }
  })

  // Live deletes (syncs to other window)
  .on('postgres_changes', {
    event:  'DELETE',
    schema: 'public',
    table:  'messages'
  }, payload => {
    const ts = payload.old.ts;
    const el = document.querySelector(`.msg-wrap[data-ts="${ts}"]`);
    if (el) {
      el.style.transition = 'opacity 0.2s, transform 0.2s';
      el.style.opacity = '0';
      el.style.transform = 'scale(0.92)';
      setTimeout(() => el.remove(), 200);
    }
  })

  // Presence — who is online
  .on('presence', { event: 'sync' }, () => {
    const state   = rtChannel.presenceState();
    const peerOn  = Object.keys(state).some(k => k === them);
    const statusEl = document.getElementById('peer-status');
    if (statusEl) statusEl.textContent = peerOn ? 'online' : 'offline';
  })

  .subscribe(async status => {
    if (status === 'SUBSCRIBED') {
      await rtChannel.track({ user: me, online_at: new Date().toISOString() });
    }
  });
}

/* ------- render a single message ------- */
function renderMsg(m) {
  const area = document.getElementById('messages-area');
  if (!area) return;
  const who = m.from === me ? 'me' : 'them';
  const u   = USERS[m.from];
  if (!u) return;

  const wrap = document.createElement('div'); wrap.className='msg-wrap '+who;
  wrap.dataset.ts = m.ts;
  const av  = document.createElement('div'); av.className='msg-av'; av.textContent=u.emoji;
  const col = document.createElement('div'); col.className='msg-col';
  const bub = document.createElement('div'); bub.className='msg-bubble';
  const ts  = document.createElement('div'); ts.className='msg-time';
  ts.textContent = new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

  // --- file or text content ---
  if (m.file_url) {
    if (m.file_type && m.file_type.startsWith('image/')) {
      // inline image preview
      const img = document.createElement('img');
      img.className = 'msg-file-img';
      img.src = m.file_url;
      img.alt = m.file_name || 'image';
      img.onclick = (e) => {
        e.stopPropagation();
        const lb = document.getElementById('lightbox');
        document.getElementById('lightbox-img').src = m.file_url;
        lb.classList.add('open');
      };
      bub.appendChild(img);
    } else {
      // file download card
      const card = document.createElement('div'); card.className = 'msg-file-card';
      const icon = document.createElement('span'); icon.className = 'file-icon';
      icon.textContent = getFileIcon(m.file_type);
      const info = document.createElement('div'); info.className = 'file-info';
      const name = document.createElement('div'); name.className = 'file-name';
      name.textContent = m.file_name || 'File';
      const meta = document.createElement('div'); meta.className = 'file-meta';
      meta.textContent = formatSize(m.file_size);
      const dl = document.createElement('a'); dl.className = 'file-dl';
      dl.href = m.file_url; dl.download = m.file_name || 'file';
      dl.target = '_blank'; dl.textContent = '⬇ Download';
      info.append(name, meta, dl);
      card.append(icon, info);
      bub.appendChild(card);
    }
  } else {
    bub.textContent = m.text;
  }

  col.appendChild(bub); col.appendChild(ts);

  if (who === 'me') {
    const del = document.createElement('button');
    del.className = 'msg-delete';
    del.title = 'Delete message';
    del.textContent = '🗑';
    del.onclick = () => deleteMessage(m.ts);
    col.appendChild(del);
  }

  wrap.appendChild(av); wrap.appendChild(col);
  area.appendChild(wrap);
}

/* ------- file upload ------- */
async function handleFileSelect(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file || !me) return;

  const MAX = 50 * 1024 * 1024; // 50 MB
  if (file.size > MAX) { showToast('File too large (max 50 MB)'); return; }

  showToast('⏳ Uploading…', 30000);

  const path = `${Date.now()}_${file.name.replace(/[^a-z0-9._-]/gi, '_')}`;
  const { error: upErr } = await db.storage
    .from('chat-files')
    .upload(path, file, { contentType: file.type, upsert: false });

  if (upErr) { showToast('Upload failed ✗'); console.error(upErr); return; }

  const { data: urlData } = db.storage.from('chat-files').getPublicUrl(path);

  const { error: msgErr } = await db.from('messages').insert({
    from:      me,
    text:      file.name,
    ts:        Date.now(),
    file_url:  urlData.publicUrl,
    file_name: file.name,
    file_type: file.type,
    file_size: file.size
  });

  if (msgErr) { showToast('Send failed ✗'); console.error(msgErr); return; }
  showToast('File sent ✓');
}

function getFileIcon(type) {
  if (!type) return '📄';
  if (type.startsWith('video/'))  return '🎥';
  if (type.startsWith('audio/'))  return '🎵';
  if (type.includes('pdf'))       return '📕';
  if (type.includes('zip') || type.includes('rar') || type.includes('7z')) return '🗂';
  if (type.includes('word') || type.includes('doc')) return '📝';
  if (type.includes('sheet') || type.includes('excel') || type.includes('csv')) return '📊';
  if (type.includes('presentation') || type.includes('ppt')) return '📊';
  return '📄';
}

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024)        return bytes + ' B';
  if (bytes < 1024*1024)   return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(1) + ' MB';
}

/* ------- end session ------- */
function endSession() {
  if (rtChannel) { rtChannel.unsubscribe(); rtChannel = null; }
  me = them = null; lastSeen = 0;
}

function resetApp() {
  document.getElementById('chat-overlay').classList.remove('visible');
  document.getElementById('chat-screen').classList.remove('visible');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('messages-area').innerHTML =
    '<div class="sys-msg">🔒 Private chat. Messages sync in real time.</div>';
  lastSeen = 0;
}

/* ------- textarea ------- */
const msgInput = document.getElementById('msg-input');
function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }
msgInput.addEventListener('input', () => autoResize(msgInput));
msgInput.addEventListener('keydown', e => {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

/* ------- toast ------- */
function showToast(msg, dur=2500) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), dur);
}

/* Clean up on page close */
window.addEventListener('beforeunload', () => { if (rtChannel) rtChannel.unsubscribe(); });
</script>
