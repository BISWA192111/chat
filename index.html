<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Calculator</title>

  <!-- PWA / Android install -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1a1a1e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Calculator" />

  <!-- iOS install -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Calculator" />
  <link rel="apple-touch-icon" href="/icon-512.png" />

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

  <!-- SEO / meta -->
  <meta name="description" content="A sleek, modern calculator app." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #1a1a1e;
      --surface:    #26262d;
      --surface2:   #2f2f38;
      --border:     #3a3a45;
      --accent:     #ff6b35;
      --text:       #f0f0f5;
      --subtext:    #888899;
      --display-bg: #111115;
      --btn-num:    #2a2a32;
      --btn-op2:    #3a3a48;
      --radius:     16px;
      --shadow:     0 20px 60px rgba(0,0,0,0.5);

      --chat-bg:      #0d0d14;
      --chat-surface: #16161f;
      --chat-panel:   #1a1a25;
      --chat-border:  #2a2a3a;
      --chat-accent:  #7c6af7;
      --chat-accent2: #a78bfa;
      --chat-me:      #4f3cdb;
      --chat-them:    #222235;
      --green:        #22c55e;
      --blue-tick:    #53bdeb;
      --red:          #ef4444;
    }

    html, body { height:100%; width:100%; font-family:'Inter',sans-serif; background:var(--bg); display:flex; align-items:center; justify-content:center; overflow:hidden; user-select:none; }

    /* ─── CALCULATOR ─── */
    #calculator { width:360px; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow),0 0 0 1px var(--border); padding:24px 20px 20px; display:flex; flex-direction:column; gap:16px; }
    #calc-display { background:var(--display-bg); border-radius:12px; padding:20px 20px 14px; text-align:right; border:1px solid var(--border); min-height:100px; display:flex; flex-direction:column; justify-content:flex-end; gap:6px; }
    #calc-expression { font-family:'Share Tech Mono',monospace; font-size:14px; color:var(--subtext); min-height:20px; }
    #calc-result { font-family:'Share Tech Mono',monospace; font-size:38px; color:var(--text); letter-spacing:-1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #calc-buttons { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    .calc-btn { height:72px; border:none; border-radius:12px; font-family:'Inter',sans-serif; font-size:20px; font-weight:500; cursor:pointer; transition:transform 0.08s,filter 0.08s; position:relative; overflow:hidden; }
    .calc-btn::after { content:''; position:absolute; inset:0; background:rgba(255,255,255,0); transition:background 0.12s; border-radius:inherit; }
    .calc-btn:active::after { background:rgba(255,255,255,0.12); }
    .calc-btn:active { transform:scale(0.94); }
    .btn-num  { background:var(--btn-num);  color:var(--text); }
    .btn-op   { background:var(--btn-op2);  color:var(--accent); font-weight:600; }
    .btn-fn   { background:var(--surface2); color:var(--subtext); font-size:16px; }
    .btn-eq   { background:var(--accent);   color:#fff; font-weight:700; }
    .btn-zero { grid-column:span 2; }
    .btn-num:hover { background:#333340; }
    .btn-op:hover  { background:#44445a; }
    .btn-fn:hover  { background:#37373f; }
    .btn-eq:hover  { filter:brightness(1.12); }

    /* ─── CHAT OVERLAY ─── */
    #chat-overlay { position:fixed; inset:0; background:var(--chat-bg); display:none; flex-direction:column; z-index:100; animation:fadeIn 0.35s ease; }
    #chat-overlay.visible { display:flex; }
    @keyframes fadeIn { from{opacity:0;transform:scale(0.97)} to{opacity:1;transform:scale(1)} }

    /* ─── LOGIN SCREEN ─── */
    #login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:28px; padding:32px; }
    .login-logo { width:80px; height:80px; background:linear-gradient(135deg,var(--chat-accent),var(--chat-accent2)); border-radius:24px; display:flex; align-items:center; justify-content:center; font-size:40px; box-shadow:0 10px 40px rgba(124,106,247,0.45); animation:logoPop 0.5s cubic-bezier(.34,1.56,.64,1); }
    @keyframes logoPop { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
    .login-title  { font-size:28px; font-weight:700; color:var(--text); letter-spacing:-0.5px; }
    .login-sub    { font-size:13px; color:var(--subtext); text-align:center; line-height:1.7; }
    .user-cards   { display:flex; gap:14px; width:100%; max-width:340px; }
    .user-card    { flex:1; background:var(--chat-surface); border:2px solid var(--chat-border); border-radius:16px; padding:22px 14px; display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer; transition:border-color 0.2s,transform 0.15s,box-shadow 0.2s; }
    .user-card:hover  { border-color:var(--chat-accent); transform:translateY(-3px); box-shadow:0 8px 30px rgba(124,106,247,0.2); }
    .user-card:active { transform:scale(0.97); }
    .user-card .uc-avatar { width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:30px; overflow:hidden; flex-shrink:0; }
    .user-card .uc-avatar img { width:100%; height:100%; object-fit:cover; }
    .user-card .uc-name  { font-size:16px; font-weight:700; color:var(--text); }
    .user-card .uc-label { font-size:11px; color:var(--subtext); font-weight:500; }
    .back-btn { background:var(--chat-surface); color:var(--subtext); border:1px solid var(--chat-border); border-radius:10px; padding:12px 28px; font-family:'Inter',sans-serif; font-size:14px; font-weight:600; cursor:pointer; transition:background 0.15s; }
    .back-btn:hover { background:var(--chat-panel); }

    /* ─── CHAT SCREEN ─── */
    #chat-screen { display:none; flex-direction:column; height:100%; }
    #chat-screen.visible { display:flex; }

    #chat-header { background:var(--chat-surface); border-bottom:1px solid var(--chat-border); padding:12px 16px; display:flex; align-items:center; gap:12px; }
    .chat-avatar { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; overflow:hidden; cursor:pointer; transition:box-shadow 0.2s; }
    .chat-avatar:hover { box-shadow:0 0 0 2px var(--chat-accent); }
    .chat-avatar img { width:100%; height:100%; object-fit:cover; }
    .chat-header-info { flex:1; }
    .chat-header-name { font-size:16px; font-weight:700; color:var(--text); }
    .chat-header-sub  { font-size:11px; color:var(--green); display:flex; align-items:center; gap:5px; }
    .chat-header-sub.offline { color:var(--subtext); }
    .chat-header-sub::before { content:''; width:6px; height:6px; background:currentColor; border-radius:50%; display:inline-block; }
    .hdr-btn { background:none; border:none; color:var(--subtext); font-size:20px; cursor:pointer; padding:6px; border-radius:8px; transition:background 0.15s,color 0.15s; }
    .hdr-btn:hover { background:var(--chat-panel); color:var(--text); }
    .hdr-close:hover { color:var(--red); }

    /* ─── REPLY BAR ─── */
    #reply-bar { display:none; align-items:center; gap:10px; background:var(--chat-panel); border-top:1px solid var(--chat-border); padding:8px 16px; }
    #reply-bar.visible { display:flex; }
    .reply-bar-line { flex:1; border-left:3px solid var(--chat-accent); padding-left:10px; }
    .reply-bar-who  { font-size:11px; font-weight:700; color:var(--chat-accent2); }
    .reply-bar-text { font-size:12px; color:var(--subtext); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:260px; }
    #reply-cancel   { background:none; border:none; color:var(--subtext); font-size:18px; cursor:pointer; padding:4px; border-radius:6px; line-height:1; }
    #reply-cancel:hover { color:var(--red); }

    /* ─── MESSAGES ─── */
    #messages-area { flex:1; overflow-y:auto; padding:16px 14px; display:flex; flex-direction:column; gap:8px; scroll-behavior:smooth; }
    #messages-area::-webkit-scrollbar { width:4px; }
    #messages-area::-webkit-scrollbar-thumb { background:var(--chat-border); border-radius:2px; }

    .msg-wrap { display:flex; gap:8px; align-items:flex-end; animation:msgIn 0.2s ease; position:relative; }
    @keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .msg-wrap.me   { flex-direction:row-reverse; }
    .msg-wrap.them { flex-direction:row; }
    .msg-wrap.highlighted { animation:highlight 0.8s ease; }
    @keyframes highlight { 0%,100%{background:transparent} 40%{background:rgba(124,106,247,0.18)} }

    .msg-av { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; overflow:hidden; }
    .msg-av img { width:100%; height:100%; object-fit:cover; }
    .msg-wrap.me   .msg-av { background:var(--chat-me); }
    .msg-wrap.them .msg-av { background:var(--chat-them); border:1px solid var(--chat-border); }

    .msg-col { display:flex; flex-direction:column; gap:2px; max-width:72%; }
    .msg-wrap.me .msg-col { align-items:flex-end; }

    /* reply snippet */
    .reply-snippet { background:rgba(0,0,0,0.22); border-radius:10px 10px 0 0; border-left:3px solid var(--chat-accent2); padding:7px 11px; margin-bottom:-4px; cursor:pointer; }
    .reply-snippet-who  { font-size:10px; font-weight:700; color:var(--chat-accent2); }
    .reply-snippet-text { font-size:12px; color:rgba(255,255,255,0.65); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; }

    .msg-bubble { width:fit-content; max-width:100%; padding:10px 15px 8px; border-radius:18px; font-size:15px; line-height:1.6; color:var(--text); word-break:break-word; text-align:left; position:relative; -webkit-tap-highlight-color:transparent; }
    .msg-wrap.me   .msg-bubble { background:linear-gradient(135deg,var(--chat-me),#6b3fcf); border-bottom-right-radius:5px; }
    .msg-wrap.them .msg-bubble { background:var(--chat-them); border:1px solid var(--chat-border); border-bottom-left-radius:5px; }
    .msg-bubble.optimistic { opacity:0.65; }
    /* Long-press ripple */
    .msg-bubble.pressing { transform:scale(0.97); transition:transform 0.15s; }

    .msg-footer { display:flex; align-items:center; gap:4px; margin-top:1px; }
    .msg-time   { font-size:10px; color:var(--subtext); }
    .msg-ticks  { font-size:11px; line-height:1; }
    .msg-ticks.sent { color:var(--subtext); }
    .msg-ticks.seen { color:var(--blue-tick); }
    .msg-delete { background:none; border:none; cursor:pointer; font-size:13px; padding:2px 4px; border-radius:6px; color:var(--subtext); line-height:1; }
    .msg-delete:hover { color:var(--red); background:rgba(239,68,68,0.12); }

    /* ─── LINKS IN MESSAGES ─── */
    .msg-link { color:#7dd3fc; text-decoration:underline; text-decoration-color:rgba(125,211,252,0.4); word-break:break-all; transition:color 0.15s; cursor:pointer; }
    .msg-link:hover { color:#bae6fd; text-decoration-color:#bae6fd; }
    .msg-wrap.me .msg-link { color:#c4b5fd; text-decoration-color:rgba(196,181,253,0.4); }
    .msg-wrap.me .msg-link:hover { color:#ddd6fe; text-decoration-color:#ddd6fe; }

    /* ─── VOICE MESSAGE ─── */
    .msg-voice { display:flex; align-items:center; gap:10px; padding:2px 0; }
    .voice-play-btn { width:36px; height:36px; border-radius:50%; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; transition:transform 0.15s, filter 0.15s; }
    .msg-wrap.me   .voice-play-btn { background:rgba(255,255,255,0.25); }
    .msg-wrap.them .voice-play-btn { background:var(--chat-accent); }
    .voice-play-btn:hover { filter:brightness(1.2); transform:scale(1.08); }
    .voice-waveform { flex:1; height:32px; position:relative; display:flex; align-items:center; gap:2px; overflow:hidden; }
    .voice-bar { width:3px; border-radius:2px; background:rgba(255,255,255,0.4); flex-shrink:0; transition:background 0.15s; }
    .voice-bar.active { background:rgba(255,255,255,0.9); }
    .voice-duration { font-size:11px; color:rgba(255,255,255,0.7); font-variant-numeric:tabular-nums; white-space:nowrap; }

    /* ─── MIC BUTTON ─── */
    #mic-btn { width:50px; height:50px; border:1.5px solid var(--chat-border); border-radius:14px; color:var(--subtext); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background 0.15s,color 0.15s,border-color 0.15s,transform 0.1s,box-shadow 0.2s; background:var(--chat-panel); }
    #mic-btn:hover { background:var(--chat-surface); color:var(--chat-accent2); border-color:var(--chat-accent); }
    #mic-btn.recording { background:rgba(239,68,68,0.15); border-color:var(--red); color:var(--red); animation:micPulse 1s ease-in-out infinite; box-shadow:0 0 0 0 rgba(239,68,68,0.5); }
    @keyframes micPulse { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.5)} 50%{box-shadow:0 0 0 8px rgba(239,68,68,0)} }
    #mic-btn:active { transform:scale(0.9); }

    /* ─── RECORDING STATUS BAR ─── */
    #recording-bar { display:none; align-items:center; gap:10px; background:rgba(239,68,68,0.1); border-top:1px solid rgba(239,68,68,0.3); padding:8px 16px; }
    #recording-bar.visible { display:flex; }
    .rec-dot { width:8px; height:8px; border-radius:50%; background:var(--red); animation:blink 1s step-start infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .rec-label { font-size:13px; color:var(--red); font-weight:600; flex:1; }
    .rec-time { font-size:13px; color:var(--subtext); font-variant-numeric:tabular-nums; }
    #rec-cancel { background:none; border:none; color:var(--subtext); font-size:18px; cursor:pointer; padding:4px; border-radius:6px; line-height:1; }
    #rec-cancel:hover { color:var(--red); }

    /* ─── PRIVACY LOCK SCREEN ─── */
    #privacy-overlay { position:fixed; inset:0; background:rgba(13,13,20,0.98); z-index:1000; display:none; flex-direction:column; align-items:center; justify-content:center; gap:20px; backdrop-filter:blur(20px); }
    #privacy-overlay.show { display:flex; }
    .privacy-icon { font-size:56px; animation:lockBounce 0.5s cubic-bezier(.34,1.56,.64,1); }
    @keyframes lockBounce { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
    .privacy-title { font-size:20px; font-weight:700; color:var(--text); }
    .privacy-sub { font-size:13px; color:var(--subtext); text-align:center; line-height:1.6; max-width:260px; }

    .sys-msg { text-align:center; font-size:12px; color:var(--subtext); padding:4px 0; }

    /* ─── REACTIONS ─── */
    .reactions-row { display:flex; flex-wrap:wrap; gap:4px; margin-top:3px; }
    .reaction-pill { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.14); border-radius:99px; padding:2px 8px; font-size:13px; cursor:pointer; transition:background 0.15s,transform 0.1s; display:flex; align-items:center; gap:3px; user-select:none; }
    .reaction-pill:hover { background:rgba(255,255,255,0.16); transform:scale(1.08); }
    .reaction-pill.mine { background:rgba(124,106,247,0.25); border-color:var(--chat-accent); }
    .reaction-pill span { font-size:10px; color:var(--subtext); font-weight:600; }

    /* ─── FILE MESSAGES ─── */
    .msg-file-img { max-width:100%; max-height:260px; border-radius:12px; display:block; cursor:zoom-in; object-fit:cover; }
    .msg-file-img:hover { opacity:0.88; }
    .msg-file-card { display:flex; align-items:center; gap:12px; padding:4px 2px; }
    .file-icon { font-size:28px; flex-shrink:0; }
    .file-info { display:flex; flex-direction:column; gap:3px; min-width:0; }
    .file-name { font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px; }
    .file-meta { font-size:11px; color:rgba(255,255,255,0.5); }
    .file-dl   { font-size:12px; font-weight:600; color:var(--chat-accent2); text-decoration:none; display:inline-flex; align-items:center; gap:4px; margin-top:2px; }
    .file-dl:hover { text-decoration:underline; }

    /* ─── ATTACH / SEND ─── */
    #attach-btn { width:50px; height:50px; background:var(--chat-panel); border:1.5px solid var(--chat-border); border-radius:14px; color:var(--subtext); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background 0.15s,color 0.15s,border-color 0.15s; }
    #attach-btn:hover { background:var(--chat-surface); color:var(--chat-accent2); border-color:var(--chat-accent); }
    #attach-btn:active { transform:scale(0.93); }
    #send-btn { width:50px; height:50px; background:linear-gradient(135deg,var(--chat-accent),var(--chat-accent2)); border:none; border-radius:14px; color:#fff; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:filter 0.15s,transform 0.1s,box-shadow 0.15s; box-shadow:0 4px 16px rgba(124,106,247,0.35); }
    #send-btn:hover  { filter:brightness(1.12); box-shadow:0 6px 22px rgba(124,106,247,0.5); }
    #send-btn:active { transform:scale(0.93); }

    /* ─── INPUT ─── */
    #chat-input-area { background:var(--chat-surface); border-top:1px solid var(--chat-border); padding:12px 14px; display:flex; gap:10px; align-items:flex-end; }
    #msg-input { flex:1; background:var(--chat-panel); border:1.5px solid var(--chat-border); border-radius:14px; padding:13px 16px; color:var(--text); font-family:'Inter',sans-serif; font-size:15px; outline:none; resize:none; max-height:140px; min-height:50px; overflow-y:auto; transition:border-color 0.2s,box-shadow 0.2s; line-height:1.6; }
    #msg-input:focus { border-color:var(--chat-accent); box-shadow:0 0 0 3px rgba(124,106,247,0.18); }
    #msg-input::placeholder { color:var(--subtext); }

    /* ─── LIGHTBOX ─── */
    #lightbox { position:fixed; inset:0; background:rgba(0,0,0,0.9); display:none; align-items:center; justify-content:center; z-index:999; cursor:zoom-out; backdrop-filter:blur(6px); }
    #lightbox.open { display:flex; }
    #lightbox img { max-width:92vw; max-height:92vh; border-radius:12px; box-shadow:0 20px 80px rgba(0,0,0,0.8); }

    /* ═══════════════════════════════════════
       LONG-PRESS ACTION SHEET (WhatsApp style)
    ═══════════════════════════════════════ */
    #action-sheet-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.55);
      z-index:300; display:none; flex-direction:column;
      justify-content:flex-end; backdrop-filter:blur(4px);
    }
    #action-sheet-overlay.open { display:flex; }

    .action-sheet {
      background:var(--chat-surface); border-radius:24px 24px 0 0;
      padding:16px 0 calc(env(safe-area-inset-bottom)+16px);
      animation:slideUp 0.28s cubic-bezier(.34,1.4,.64,1);
      max-height:85vh; overflow-y:auto;
    }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }

    /* Message preview at top of sheet */
    .as-preview {
      margin:0 16px 14px; padding:12px 14px;
      background:var(--chat-panel); border-radius:14px;
      border-left:4px solid var(--chat-accent);
      font-size:14px; color:rgba(255,255,255,0.75); line-height:1.5;
      max-height:80px; overflow:hidden; text-overflow:ellipsis;
    }

    /* Quick emoji strip */
    .as-emoji-strip {
      display:flex; align-items:center; gap:4px;
      padding:4px 16px 14px; overflow-x:auto;
      scrollbar-width:none;
    }
    .as-emoji-strip::-webkit-scrollbar { display:none; }
    .as-quick-emoji {
      width:48px; height:48px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:26px; border-radius:50%; cursor:pointer;
      transition:transform 0.15s, background 0.15s;
      background:var(--chat-panel);
    }
    .as-quick-emoji:hover, .as-quick-emoji:active { transform:scale(1.3); background:rgba(124,106,247,0.2); }
    .as-quick-emoji.selected { background:rgba(124,106,247,0.35); box-shadow:0 0 0 2px var(--chat-accent); }

    /* "More emojis" toggle */
    .as-more-emoji {
      width:48px; height:48px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:18px; border-radius:50%; cursor:pointer;
      background:var(--chat-panel); color:var(--subtext);
      transition:transform 0.15s, background 0.15s;
      border:1.5px dashed var(--chat-border);
    }
    .as-more-emoji:hover { background:var(--chat-border); color:var(--text); }

    /* Full emoji grid (hidden by default) */
    .as-emoji-grid {
      display:none; flex-wrap:wrap; padding:0 16px 14px; gap:6px;
    }
    .as-emoji-grid.open { display:flex; }
    .as-emoji-grid-item {

const SECRET = '12345';
let cInput='', cResult='0', cOp=null, cPrev=null, cNewNum=false, cExpr='';
const resultEl = document.getElementById('calc-result');
const exprEl   = document.getElementById('calc-expression');
function display(v) { resultEl.textContent = v.length>12 ? parseFloat(v).toExponential(4) : v; }
document.getElementById('calc-buttons').addEventListener('click', e => {
  const btn = e.target.closest('.calc-btn'); if (!btn) return;
  const a = btn.dataset.action;
  if (a==='digit') { const d=btn.dataset.digit; cInput+=d; if(cNewNum){cResult=d;cNewNum=false;}else cResult=cResult==='0'?d:cResult+d; display(cResult); }
  else if (a==='dot') { if(!cResult.includes('.')){cResult+='.';display(cResult);} cInput+='.'; }
  else if (a==='op') { if(cOp&&!cNewNum)doCalc(); cPrev=parseFloat(cResult); cOp=btn.dataset.op; cNewNum=true; cExpr=cResult+' '+cOp; exprEl.textContent=cExpr; cInput=''; }
  else if (a==='equals') { checkSecret(); if(cOp){cExpr+=' '+cResult; exprEl.textContent=cExpr; doCalc();} else exprEl.textContent=''; cInput=''; }
  else if (a==='clear') { cInput='';cResult='0';cOp=null;cPrev=null;cNewNum=false;cExpr=''; exprEl.textContent=''; display('0'); }
  else if (a==='sign') { if(cResult!=='0'){cResult=String(-parseFloat(cResult));display(cResult);} }
  else if (a==='percent') { cResult=String(parseFloat(cResult)/100); display(cResult); }
});
function doCalc() {
  if(cPrev===null||!cOp) return; const cur=parseFloat(cResult); let r;
  if(cOp==='+')r=cPrev+cur; else if(cOp==='−')r=cPrev-cur; else if(cOp==='×')r=cPrev*cur; else if(cOp==='÷')r=cur!==0?cPrev/cur:'Error';
  cResult=typeof r==='number'?String(parseFloat(r.toFixed(10))):r; cOp=null; cPrev=null; cNewNum=true; display(cResult); exprEl.textContent='';
}
function checkSecret() { if(cInput.replace(/[^0-9]/g,'')=== SECRET) openChatOverlay(); }

/* ════════════════════════════════════════
   PRIVACY LOCK — auto-lock after 3 min away
════════════════════════════════════════ */
let privacyTimer = null;
const PRIVACY_TIMEOUT_MS = 3 * 60 * 1000; // 3 minutes

function startPrivacyTimer() {
  clearPrivacyTimer();
  if (!me) return;
  privacyTimer = setTimeout(() => {
    triggerPrivacyLock();
  }, PRIVACY_TIMEOUT_MS);
}

function clearPrivacyTimer() {
  clearTimeout(privacyTimer);
  privacyTimer = null;
}

function triggerPrivacyLock() {
  if (!me) return; // already logged out
  const overlay = document.getElementById('privacy-overlay');
  overlay.classList.add('show');
  setTimeout(() => {
    overlay.classList.remove('show');
    closeChatOverlay();
  }, 2200);
}

// Listen for visibility changes to start/stop the privacy timer
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    // User switched tab or minimised — start countdown
    startPrivacyTimer();
  } else {
    // User came back before timeout — cancel
    clearPrivacyTimer();
  }
});

// Also detect window blur (alt-tab, window minimise without tab-switch)
window.addEventListener('blur',  () => { if (me) startPrivacyTimer(); });
window.addEventListener('focus', () => { clearPrivacyTimer(); });

/* ════════════════════════════════════════
   VOICE RECORDING
════════════════════════════════════════ */
let mediaRecorder = null;
let audioChunks   = [];
let recTimerInterval = null;
let recSeconds = 0;
let isRecording = false;

function startRecording() {
  if (isRecording || !me) return;
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    isRecording = true;
    audioChunks = [];
    recSeconds  = 0;
    const micBtn = document.getElementById('mic-btn');
    micBtn.classList.add('recording');
    micBtn.textContent = '⏹️';
    document.getElementById('recording-bar').classList.add('visible');
    document.getElementById('rec-time').textContent = '0:00';
    recTimerInterval = setInterval(() => {
      recSeconds++;
      const m = Math.floor(recSeconds / 60);
      const s = String(recSeconds % 60).padStart(2, '0');
      document.getElementById('rec-time').textContent = `${m}:${s}`;
      if (recSeconds >= 120) stopRecording(true); // max 2 min
    }, 1000);

    const opts = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? { mimeType: 'audio/webm;codecs=opus' }
      : {};
    mediaRecorder = new MediaRecorder(stream, opts);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      if (audioChunks.length) sendVoiceMessage();
    };
    mediaRecorder.start(200);
  }).catch(() => { showToast('Microphone permission denied'); });
}

function stopRecording(send = true) {
  if (!isRecording) return;
  isRecording = false;
  clearInterval(recTimerInterval);
  const micBtn = document.getElementById('mic-btn');
  micBtn.classList.remove('recording');
  micBtn.textContent = '🎙️';
  document.getElementById('recording-bar').classList.remove('visible');
  if (!send) audioChunks = [];
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  else if (!send) audioChunks = [];
}

function cancelRecording() {
  isRecording = false;
  clearInterval(recTimerInterval);
  audioChunks = [];
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.ondataavailable = null;
    mediaRecorder.onstop = null;
    mediaRecorder.stop();
  }
  const micBtn = document.getElementById('mic-btn');
  micBtn.classList.remove('recording');
  micBtn.textContent = '🎙️';
  document.getElementById('recording-bar').classList.remove('visible');
}

async function sendVoiceMessage() {
  if (!db || !me || !audioChunks.length) return;
  const mimeType = audioChunks[0]?.type || 'audio/webm';
  const ext = mimeType.includes('ogg') ? 'ogg' : mimeType.includes('mp4') ? 'mp4' : 'webm';
  const blob = new Blob(audioChunks, { type: mimeType });
  audioChunks = [];
  if (blob.size < 1000) { showToast('Recording too short'); return; }
  showToast('⏳ Sending voice message…', 15000);
  const path = `voice_${Date.now()}.${ext}`;
  const { error: upErr } = await db.storage.from('chat-files').upload(path, blob, { contentType: mimeType, upsert: false });
  if (upErr) { showToast('Voice send failed ✗'); return; }
  const { data: urlData } = db.storage.from('chat-files').getPublicUrl(path);
  const durationSec = recSeconds || 1;
  const { error: msgErr } = await db.from('messages').insert({
    from: me, text: `🎙 Voice message (${durationSec}s)`, ts: Date.now(),
    file_url: urlData.publicUrl, file_name: `voice_${durationSec}s.${ext}`,
    file_type: mimeType, file_size: blob.size,
    voice_duration: durationSec
  });
  showToast(msgErr ? 'Voice send failed ✗' : 'Voice message sent ✓');
}

// Wire mic button: single click toggles record on/off
document.addEventListener('DOMContentLoaded', () => {
  const micBtn = document.getElementById('mic-btn');
  if (!micBtn) return;
  micBtn.addEventListener('click', () => {
    if (isRecording) stopRecording(true);
    else startRecording();
  });
});

/* ════════════════════════════════════════
   LINK AUTO-DETECTION UTILITY
════════════════════════════════════════ */
const URL_REGEX = /(https?:\/\/[^\s<>"']+)/gi;
function linkifyText(text) {
  // Split text into parts, wrapping URLs in anchor tags
  const parts = text.split(URL_REGEX);
  return parts.map(part => {
    if (URL_REGEX.test(part)) {
      URL_REGEX.lastIndex = 0; // reset regex
      const safe = part.replace(/"/g, '&quot;');
      return `<a href="${safe}" class="msg-link" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${part}</a>`;
    }
    return part.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }).join('');
}

/* ════════════════════════════════════════
   LOGIN
════════════════════════════════════════ */
async function loginAs(user) {
  me   = user;
  them = user === 'kinny' ? 'cosmic' : 'kinny';
  const peerAvEl = document.getElementById('peer-avatar');
  peerAvEl.style.background = USERS[them].color;
  updateAvatarEl(peerAvEl, them, profiles[them]);
  document.getElementById('peer-name').textContent = them.charAt(0).toUpperCase() + them.slice(1);
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('chat-screen').classList.add('visible');
  document.getElementById('msg-input').focus();

  // Request notification permission
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission().then(p => { if(p==='granted') registerServiceWorker(); });
  } else if ('Notification' in window && Notification.permission === 'granted') {
    registerServiceWorker();
  }

  if (!db) { showToast('⚠️ Supabase not configured', 5000); return; }
  await Promise.all([loadProfiles(), loadMessages()]);
  subscribeRealtime();
  setupVisibilityObserver();
}

async function loadProfiles() {
  const { data } = await db.from('profiles').select('*');
  if (!data) return;
  data.forEach(p => { profiles[p.username] = p.avatar_url; });
  updateAvatarEl(document.getElementById('peer-avatar'), them, profiles[them]);
}

/* ════════════════════════════════════════
   LOAD MESSAGES
════════════════════════════════════════ */
async function loadMessages() {
  const area = document.getElementById('messages-area');
  area.innerHTML = '<div class="sys-msg">🔒 Private chat. Messages sync in real time.</div>';
  lastSeen = 0; reactionsCache = {};

  const [msgRes, reactRes] = await Promise.all([
    db.from('messages').select('*').order('ts', { ascending: true }),
    db.from('reactions').select('*')
  ]);
  if (msgRes.error) { showToast('Failed to load messages'); return; }

  (reactRes.data || []).forEach(r => {
    if (!reactionsCache[r.msg_ts]) reactionsCache[r.msg_ts] = {};
    reactionsCache[r.msg_ts][r.from] = r.emoji;
  });
  (msgRes.data || []).forEach(m => renderMsg(m));
  if (msgRes.data?.length) lastSeen = msgRes.data[msgRes.data.length-1].ts;
  area.scrollTop = area.scrollHeight;
  markPeerMessagesSeen(msgRes.data || []);
}

/* ════════════════════════════════════════
   READ RECEIPTS
════════════════════════════════════════ */
async function markPeerMessagesSeen(messages) {
  if (!db || !me) return;
  const unseenTs = messages.filter(m => m.from === them && !m.seen_at).map(m => m.ts);
  if (!unseenTs.length) return;
  await db.from('messages').update({ seen_at: Date.now() }).in('ts', unseenTs);
}
async function markSingleSeen(ts) {
  if (!db || !me) return;
  await db.from('messages').update({ seen_at: Date.now() }).eq('ts', ts).is('seen_at', null);
}
function setupVisibilityObserver() {
  if (visibilityObserver) visibilityObserver.disconnect();
  const area = document.getElementById('messages-area');
  visibilityObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const wrap = entry.target;
      if (wrap.dataset.from === them && !wrap.dataset.seen) {
        wrap.dataset.seen = '1';
        markSingleSeen(Number(wrap.dataset.ts));
        visibilityObserver.unobserve(wrap);
      }
    });
  }, { root: area, threshold: 0.5 });
}
document.addEventListener('visibilitychange', async () => {
  if (!document.hidden && me && db) {
    const area = document.getElementById('messages-area');
    const unseenTs = [...area.querySelectorAll(`.msg-wrap[data-from="${them}"]`)]
      .filter(w => !w.dataset.seen).map(w => Number(w.dataset.ts));
    if (unseenTs.length) {
      unseenTs.forEach(ts => {
        const w = document.querySelector(`.msg-wrap[data-ts="${ts}"]`); if(w) w.dataset.seen='1';
      });
      await db.from('messages').update({ seen_at: Date.now() }).in('ts', unseenTs);
    }
  }
});

/* ════════════════════════════════════════
   SEND MESSAGE (optimistic)
════════════════════════════════════════ */
async function sendMessage() {
  const el = document.getElementById('msg-input');
  const t  = el.value.trim();
  if (!t || !me) return;
  if (!db) { showToast('⚠️ Add Supabase credentials first'); return; }
  el.value = ''; autoResize(el);

  const ts = Date.now();
  const msgObj = {
    from: me, text: t, ts,
    reply_to:   replyState?.ts   || null,
    reply_text: replyState?.text || null,
    reply_from: replyState?.from || null
  };
  cancelReply();

  // Optimistic render
  renderMsg({ ...msgObj, _optimistic: true });
  const area = document.getElementById('messages-area');
  area.scrollTop = area.scrollHeight;

  const { error } = await db.from('messages').insert(msgObj);
  if (error) {
    document.querySelector(`.msg-wrap[data-ts="${ts}"]`)?.remove();
    showToast('Send failed ✗');
  } else {
    document.querySelector(`.msg-wrap[data-ts="${ts}"] .msg-bubble`)?.classList.remove('optimistic');
    // trigger push to recipient
    sendPushToRecipient(t);
  }
}

════════════════════════════════════════ */
async function deleteMessage(ts) {
  const el = document.querySelector(`.msg-wrap[data-ts="${ts}"]`);
  if (el) { el.style.transition='opacity 0.2s,transform 0.2s'; el.style.opacity='0'; el.style.transform='scale(0.92)'; }
  const { error } = await db.from('messages').delete().eq('ts', ts);
  if (error) { if(el){el.style.opacity='1';el.style.transform='';} showToast('Delete failed ✗'); } else { showToast('Message deleted'); }
}

/* ════════════════════════════════════════
   EMOJI REACTIONS (multiple per message, one per user)
════════════════════════════════════════ */
async function toggleReaction(msgTs, emoji) {
  if (!db || !me) return;
  const existing = reactionsCache[msgTs]?.[me];
  if (existing === emoji) {
    await db.from('reactions').delete().eq('msg_ts', msgTs).eq('from', me);
  } else {
    await db.from('reactions').upsert({ msg_ts: msgTs, from: me, emoji }, { onConflict: 'msg_ts,from' });
  }
}

function refreshReactionsUI(msgTs) {
  const wrap = document.querySelector(`.msg-wrap[data-ts="${msgTs}"]`);
  const row  = wrap?.querySelector('.reactions-row');
  if (!row) return;
  const isMe = wrap.classList.contains('me');
  renderReactionPills(row, msgTs, isMe);
}

function renderReactionPills(row, msgTs, isMe) {
  row.innerHTML = '';
  const rxns = reactionsCache[msgTs] || {};
  const grouped = {};
  Object.entries(rxns).forEach(([user, emoji]) => {
    if (!grouped[emoji]) grouped[emoji] = [];
    grouped[emoji].push(user);
  });
  Object.entries(grouped).forEach(([emoji, users]) => {
    const pill = document.createElement('div');
    pill.className = 'reaction-pill' + (users.includes(me) ? ' mine' : '');
    pill.title = users.join(', ');
    pill.innerHTML = `${emoji}<span>${users.length > 1 ? users.length : ''}</span>`;
    pill.onclick = () => toggleReaction(msgTs, emoji);
    row.appendChild(pill);
  });
}

/* ════════════════════════════════════════
   ACTION SHEET (long press — WhatsApp style)
════════════════════════════════════════ */
function showActionSheet(m) {
  asCurrentMsg = m;
  const overlay = document.getElementById('action-sheet-overlay');
  const preview = document.getElementById('as-preview');
  const strip   = document.getElementById('as-emoji-strip');
  const grid    = document.getElementById('as-emoji-grid');
  const delBtn  = document.getElementById('as-delete-btn');

  // Preview text
  preview.textContent = m.text || m.file_name || '(attachment)';

  // Build quick emoji strip
  strip.innerHTML = '';
  const currentRxn = reactionsCache[m.ts]?.[me] || null;

  QUICK_EMOJIS.forEach(em => {
    const btn = document.createElement('div'); btn.className = 'as-quick-emoji';
    btn.textContent = em;
    if (currentRxn === em) btn.classList.add('selected');
    btn.onclick = () => { toggleReaction(m.ts, em); hideActionSheet(); };
    strip.appendChild(btn);
  });

  // "More" button
  const more = document.createElement('div'); more.className = 'as-more-emoji'; more.textContent = '➕';
  more.onclick = () => grid.classList.toggle('open');
  strip.appendChild(more);

  // Full emoji grid
  grid.innerHTML = ''; grid.classList.remove('open');
  ALL_EMOJIS.forEach(em => {
    const item = document.createElement('div'); item.className = 'as-emoji-grid-item';
    item.textContent = em;
    if (currentRxn === em) item.style.background = 'rgba(124,106,247,0.3)';
    item.onclick = () => { toggleReaction(m.ts, em); hideActionSheet(); };
    grid.appendChild(item);
  });

  // Show/hide delete (only own messages)
  delBtn.style.display = m.from === me ? '' : 'none';

  overlay.classList.add('open');
}

function hideActionSheet() {
  document.getElementById('action-sheet-overlay').classList.remove('open');
  document.getElementById('as-emoji-grid').classList.remove('open');
  asCurrentMsg = null;
}

document.getElementById('as-reply-btn').onclick = () => {
  if (asCurrentMsg) startReply(asCurrentMsg);
  hideActionSheet();
};
document.getElementById('as-copy-btn').onclick = () => {
  if (asCurrentMsg?.text) navigator.clipboard?.writeText(asCurrentMsg.text).then(() => showToast('Copied ✓'));
  hideActionSheet();
};
document.getElementById('as-delete-btn').onclick = () => {
  if (asCurrentMsg) deleteMessage(asCurrentMsg.ts);
  hideActionSheet();
};

/* ════════════════════════════════════════
   LONG PRESS SETUP
════════════════════════════════════════ */
function setupLongPress(bub, m) {
  let timer = null;
  let moved = false;

  const start = () => {
    moved = false;
    bub.classList.add('pressing');
    timer = setTimeout(() => {
      if (!moved) { bub.classList.remove('pressing'); showActionSheet(m); }
    }, 500);
  };
  const cancel = () => { clearTimeout(timer); bub.classList.remove('pressing'); };
  const move   = () => { moved = true; clearTimeout(timer); bub.classList.remove('pressing'); };

  bub.addEventListener('touchstart',  start,  { passive: true });
  bub.addEventListener('touchend',    cancel);
  bub.addEventListener('touchcancel', cancel);
  bub.addEventListener('touchmove',   move);
  bub.addEventListener('mousedown',   start);
  bub.addEventListener('mouseup',     cancel);
  bub.addEventListener('mouseleave',  cancel);
  bub.addEventListener('mousemove',   move);
  // Right-click also shows sheet
  bub.addEventListener('contextmenu', e => { e.preventDefault(); showActionSheet(m); });
}

function startReply(m) {
  replyState = { ts: m.ts, text: m.text || m.file_name || 'File', from: m.from };

  document.getElementById('msg-input').focus();
}
function cancelReply() {
  replyState = null;
  document.getElementById('reply-bar').classList.remove('visible');
}
function scrollToMsg(ts) {
  const el = document.querySelector(`.msg-wrap[data-ts="${ts}"]`);
  if (!el) return;
  el.scrollIntoView({ behavior:'smooth', block:'center' });
  el.classList.add('highlighted');
  setTimeout(() => el.classList.remove('highlighted'), 900);
}

/* ════════════════════════════════════════
   RENDER MESSAGE
════════════════════════════════════════ */
function renderMsg(m) {
  const area = document.getElementById('messages-area'); if (!area) return;
  if (!m._optimistic && document.querySelector(`.msg-wrap[data-ts="${m.ts}"]`)) return;
  const who = m.from === me ? 'me' : 'them';
  const u   = USERS[m.from]; if (!u) return;

  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + who;
  wrap.dataset.ts = m.ts;
  if (m.from === them) wrap.dataset.from = m.from;

  // Avatar
  const av = document.createElement('div'); av.className = 'msg-av'; av.style.background = u.color;
  const avUrl = profiles[m.from];
  if (avUrl) av.innerHTML = `<img src="${avUrl}" alt="${m.from}" onerror="this.style.display='none'">`;
  else av.textContent = u.emoji;

  // Col
  const col = document.createElement('div'); col.className = 'msg-col';

  // Bubble
  const bub = document.createElement('div'); bub.className = 'msg-bubble';
  if (m._optimistic) bub.classList.add('optimistic');

  // Reply snippet
  if (m.reply_to) {
    const snip = document.createElement('div'); snip.className = 'reply-snippet';
    snip.onclick = () => scrollToMsg(m.reply_to);
    const snipWho  = document.createElement('div'); snipWho.className = 'reply-snippet-who';
    snipWho.textContent = m.reply_from === me ? 'You' : (m.reply_from?.charAt(0).toUpperCase() + m.reply_from?.slice(1) || 'them');
    const snipTxt  = document.createElement('div'); snipTxt.className = 'reply-snippet-text';
    snipTxt.textContent = m.reply_text || '';
    snip.append(snipWho, snipTxt); bub.appendChild(snip);
  }

  // Content
  if (m.file_url) {
    if (m.file_type?.startsWith('image/')) {
      const img = document.createElement('img'); img.className='msg-file-img'; img.src=m.file_url; img.alt=m.file_name||'image'; img.loading='lazy';
      img.onclick = e => { e.stopPropagation(); document.getElementById('lightbox-img').src=m.file_url; document.getElementById('lightbox').classList.add('open'); };
      bub.appendChild(img);
    } else {
      const card=document.createElement('div'); card.className='msg-file-card';
      const icon=document.createElement('span'); icon.className='file-icon'; icon.textContent=getFileIcon(m.file_type);
      const info=document.createElement('div'); info.className='file-info';
      const name=document.createElement('div'); name.className='file-name'; name.textContent=m.file_name||'File';
      const meta=document.createElement('div'); meta.className='file-meta'; meta.textContent=formatSize(m.file_size);
      const dl=document.createElement('a'); dl.className='file-dl'; dl.href=m.file_url; dl.download=m.file_name||'file'; dl.target='_blank'; dl.textContent='⬇ Download';
      info.append(name,meta,dl); card.append(icon,info); bub.appendChild(card);
    }
  } else if (m.file_type && m.file_type.startsWith('audio/') && m.voice_duration) {
    // Voice message — render inline player with waveform
    const dur = m.voice_duration || 0;
    const minutes = Math.floor(dur / 60);
    const secs = String(dur % 60).padStart(2, '0');
    const voiceWrap = document.createElement('div');
    voiceWrap.className = 'msg-voice';
    // Play button
    const playBtn = document.createElement('button');
    playBtn.className = 'voice-play-btn';
    playBtn.textContent = '▶';
    // Fake waveform bars
    const waveDiv = document.createElement('div');
    waveDiv.className = 'voice-waveform';
    const barHeights = Array.from({length: 20}, () => Math.floor(Math.random() * 22) + 6);
    barHeights.forEach((h, i) => {
      const bar = document.createElement('div');
      bar.className = 'voice-bar';
      bar.style.height = h + 'px';
      bar.dataset.idx = i;
      waveDiv.appendChild(bar);
    });
    // Duration display
    const durEl = document.createElement('div');
    durEl.className = 'voice-duration';
    durEl.textContent = `${minutes}:${secs}`;
    voiceWrap.append(playBtn, waveDiv, durEl);
    bub.appendChild(voiceWrap);
    // Audio playback logic
    let audio = null;
    let animFrame = null;
    playBtn.onclick = (e) => {
      e.stopPropagation();
      if (audio && !audio.paused) {
        audio.pause();
        playBtn.textContent = '▶';
        cancelAnimationFrame(animFrame);
        waveDiv.querySelectorAll('.voice-bar').forEach(b => b.classList.remove('active'));
        return;
      }
      if (!audio) { audio = new Audio(m.file_url); }
      audio.play().then(() => {
        playBtn.textContent = '⏸';
        const bars = waveDiv.querySelectorAll('.voice-bar');
        const totalBars = bars.length;
        const updateWave = () => {
          if (!audio || audio.paused || audio.ended) return;
          const progress = audio.duration ? audio.currentTime / audio.duration : 0;
          const activeTo = Math.floor(progress * totalBars);
          bars.forEach((b, i) => i < activeTo ? b.classList.add('active') : b.classList.remove('active'));
          const elapsed = audio.currentTime;
          const em = Math.floor(elapsed/60);
          const es = String(Math.floor(elapsed%60)).padStart(2,'0');
          durEl.textContent = `${em}:${es}`;
          animFrame = requestAnimationFrame(updateWave);
        };
        animFrame = requestAnimationFrame(updateWave);
      }).catch(() => showToast('Cannot play voice message'));
      audio.onended = () => {
        playBtn.textContent = '▶';
        waveDiv.querySelectorAll('.voice-bar').forEach(b => b.classList.remove('active'));
        durEl.textContent = `${minutes}:${secs}`;
        cancelAnimationFrame(animFrame);
      };
    };
  } else {
    // Text message — auto-detect links
    const text = m.text || '';
    if (URL_REGEX.test(text)) {
      URL_REGEX.lastIndex = 0;
      bub.innerHTML = linkifyText(text);
    } else {
      bub.appendChild(document.createTextNode(text));
    }
  }

  // Footer
  const footer = document.createElement('div'); footer.className='msg-footer';
  const tsEl = document.createElement('div'); tsEl.className='msg-time';
  tsEl.textContent = new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  footer.appendChild(tsEl);
  if (who === 'me') {
    const ticks = document.createElement('div');
    ticks.className = 'msg-ticks ' + (m.seen_at ? 'seen' : 'sent');
    ticks.textContent = m.seen_at ? '✓✓' : '✓';
    ticks.dataset.tickEl = '1';
    footer.appendChild(ticks);
  }

  // Reactions row
  const rxRow = document.createElement('div'); rxRow.className='reactions-row';
  renderReactionPills(rxRow, m.ts, who==='me');

  col.appendChild(bub);
  col.appendChild(footer);
  col.appendChild(rxRow);
  wrap.appendChild(av);
  wrap.appendChild(col);
  area.appendChild(wrap);

  // Long-press
  setupLongPress(bub, m);

  // Visibility observer for read receipts
  if (m.from === them && !m.seen_at && visibilityObserver) visibilityObserver.observe(wrap);
}

/* ════════════════════════════════════════
   REALTIME SUBSCRIPTION
════════════════════════════════════════ */
function subscribeRealtime() {
  if (rtChannel) rtChannel.unsubscribe();
  rtChannel = db.channel('ghost-chat-v3', { config: { presence: { key: me } } })

  .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages' }, payload => {
    const m = payload.new;
    if (m.ts > lastSeen) {
      renderMsg(m); lastSeen = m.ts;
      const area = document.getElementById('messages-area');
      const nearBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 120;
      if (nearBottom) area.scrollTop = area.scrollHeight;
      if (m.from === them) {
        triggerNotification(m);
        if (!document.hidden) markSingleSeen(m.ts);
      }
    }
  })

  .on('postgres_changes', { event:'UPDATE', schema:'public', table:'messages' }, payload => {
    const m = payload.new;
    if (m.seen_at && m.from === me) {
      const ticks = document.querySelector(`.msg-wrap[data-ts="${m.ts}"] [data-tick-el]`);
      if (ticks) { ticks.className='msg-ticks seen'; ticks.textContent='✓✓'; }
    }
  })

  .on('postgres_changes', { event:'DELETE', schema:'public', table:'messages' }, payload => {
    const el = document.querySelector(`.msg-wrap[data-ts="${payload.old.ts}"]`);
    if (el) { el.style.transition='opacity 0.2s,transform 0.2s'; el.style.opacity='0'; el.style.transform='scale(0.92)'; setTimeout(()=>el.remove(),200); }
  })

  .on('postgres_changes', { event:'INSERT', schema:'public', table:'reactions' }, payload => {
    const r = payload.new;
    if (!reactionsCache[r.msg_ts]) reactionsCache[r.msg_ts] = {};
    reactionsCache[r.msg_ts][r.from] = r.emoji; refreshReactionsUI(r.msg_ts);
  })
  .on('postgres_changes', { event:'DELETE', schema:'public', table:'reactions' }, payload => {
    const r = payload.old;
    if (reactionsCache[r.msg_ts]) delete reactionsCache[r.msg_ts][r.from]; refreshReactionsUI(r.msg_ts);
  })
  .on('postgres_changes', { event:'UPDATE', schema:'public', table:'reactions' }, payload => {
    const r = payload.new;
    if (!reactionsCache[r.msg_ts]) reactionsCache[r.msg_ts] = {};
    reactionsCache[r.msg_ts][r.from] = r.emoji; refreshReactionsUI(r.msg_ts);
  })

  .on('postgres_changes', { event:'UPDATE', schema:'public', table:'profiles' }, payload => {
    const p = payload.new; profiles[p.username] = p.avatar_url;
    document.querySelectorAll(`.msg-wrap .msg-av`).forEach(av => {
      const wrap = av.closest('.msg-wrap');
      if (wrap && (wrap.dataset.from === p.username || (wrap.classList.contains('me') && p.username === me))) {
        updateAvatarEl(av, p.username, p.avatar_url);
      }
    });
    if (p.username === them) updateAvatarEl(document.getElementById('peer-avatar'), p.username, p.avatar_url);
  })

  .on('presence', { event:'sync' }, () => {
    const state = rtChannel.presenceState();
    const peerOn = Object.keys(state).some(k => k === them);
    const statusEl = document.getElementById('peer-status');
    if (statusEl) { statusEl.textContent = peerOn ? 'online' : 'offline'; statusEl.className = 'chat-header-sub' + (peerOn ? '' : ' offline'); }
  })

  // ── WebRTC call signaling ──
  .on('broadcast', { event: 'call' }, ({ payload }) => handleCallSignal(payload))

  .subscribe(async status => {
    if (status === 'SUBSCRIBED') {
      await rtChannel.track({ user: me, online_at: new Date().toISOString() });
    }
  });
}

/* ════════════════════════════════════════
   ████  WEBRTC CALLS  ████
════════════════════════════════════════ */
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' }
];

let pc = null;          // RTCPeerConnection
let localStream = null;
let callType = null;    // 'audio' | 'video'
let callTimerInterval = null;
let callSeconds = 0;
let isMuted = false;
let isCamOff = false;
let pendingOffer = null;   // stored when receiving call before accepting

/* ── Initiate call ── */
async function initiateCall(type) {
  if (!rtChannel || !me) { showToast('Connect to chat first'); return; }
  if (pc) { showToast('Already in a call'); return; }
  callType = type;

  try {
    localStream = await navigator.mediaDevices.getUserMedia(
      type === 'video' ? { audio: true, video: { facingMode:'user' } } : { audio: true }
    );
  } catch(e) { showToast('Mic/camera permission denied'); return; }

  pc = createPeerConnection();
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  if (type === 'video') {
    document.getElementById('local-video').srcObject = localStream;
    document.getElementById('local-video-wrap').classList.add('show');
    document.getElementById('btn-cam').style.display = '';
  }

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  // Send offer via Realtime broadcast
  rtChannel.send({ type:'broadcast', event:'call', payload: {
    action: 'offer', from: me, to: them, callType: type,
    sdp: pc.localDescription
  }});

  showInCall(them, type, 'Calling…');
  showToast(`Calling ${them}…`);
}

/* ── Receive signaling ── */
async function handleCallSignal(payload) {
  if (!payload || payload.to !== me) return;

  if (payload.action === 'offer') {
    // Incoming call
    pendingOffer = payload;
    showIncomingCall(payload.from, payload.callType);
  }
  else if (payload.action === 'answer' && pc) {
    await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
    startCallTimer();
  }
  else if (payload.action === 'ice' && pc) {
    try { await pc.addIceCandidate(new RTCIceCandidate(payload.candidate)); } catch(e){}
  }
  else if (payload.action === 'end') {
    endCall(true);
  }
  else if (payload.action === 'decline') {
    showToast(`${them} declined the call`);
    endCall(true);
  }
}

/* ── Accept incoming call ── */
async function acceptCall() {
  if (!pendingOffer) return;
  hideIncomingCall();
  callType = pendingOffer.callType;

  try {
    localStream = await navigator.mediaDevices.getUserMedia(
      callType === 'video' ? { audio: true, video: { facingMode:'user' } } : { audio: true }
    );
  } catch(e) { showToast('Mic/camera permission denied'); declineCall(); return; }

  pc = createPeerConnection();
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  if (callType === 'video') {
    document.getElementById('local-video').srcObject = localStream;
    document.getElementById('local-video-wrap').classList.add('show');
    document.getElementById('btn-cam').style.display = '';
  }

  await pc.setRemoteDescription(new RTCSessionDescription(pendingOffer.sdp));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  rtChannel.send({ type:'broadcast', event:'call', payload: {
    action: 'answer', from: me, to: them, sdp: pc.localDescription
  }});

  showInCall(pendingOffer.from, callType, '');
  startCallTimer();
  pendingOffer = null;
}

/* ── Decline ── */
function declineCall() {
  hideIncomingCall();
  if (pendingOffer) {
    rtChannel?.send({ type:'broadcast', event:'call', payload: { action:'decline', from:me, to:pendingOffer.from }});
    pendingOffer = null;
  }
  stopRingtone();
}

/* ── Create peer connection ── */
function createPeerConnection() {
  const connection = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  connection.onicecandidate = e => {
    if (e.candidate) {
      rtChannel.send({ type:'broadcast', event:'call', payload: {
        action: 'ice', from: me, to: them, candidate: e.candidate
      }});
    }
  };

  connection.ontrack = e => {
    const remoteVideo = document.getElementById('remote-video');
    remoteVideo.srcObject = e.streams[0];
    if (callType === 'video') {
      remoteVideo.classList.add('show');
      document.getElementById('remote-audio-avatar').style.display = 'none';
    }
  };

  connection.onconnectionstatechange = () => {
    if (['disconnected','failed','closed'].includes(connection.connectionState)) endCall(true);
  };
  return connection;
}

/* ── End call ── */
function endCall(remote = false) {
  if (!remote && rtChannel) {
    rtChannel.send({ type:'broadcast', event:'call', payload: { action:'end', from:me, to:them }});
  }
  if (pc)          { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  clearInterval(callTimerInterval); callTimerInterval = null; callSeconds = 0;
  stopRingtone();
  pendingOffer = null;

  // Reset video elements
  ['remote-video','local-video'].forEach(id => {
    const v = document.getElementById(id); if(v) v.srcObject = null;
  });
  document.getElementById('remote-video').classList.remove('show');
  document.getElementById('local-video-wrap').classList.remove('show');
  document.getElementById('remote-audio-avatar').style.display = '';
  document.getElementById('btn-cam').style.display = 'none';
  isMuted = false; isCamOff = false;
  document.getElementById('btn-mute').className    = 'ctrl-btn off';
  document.getElementById('btn-mute').textContent  = '🎤';

  hideIncomingCall();
  document.getElementById('in-call-ui').classList.remove('show');
  document.getElementById('call-overlay').classList.remove('open');
}

/* ── Call UI helpers ── */
function showIncomingCall(from, type) {
  const avEl = document.getElementById('inc-avatar');
  avEl.style.background = USERS[from]?.color || '#333';
  updateAvatarEl(avEl, from, profiles[from]);
  document.getElementById('inc-name').textContent = from.charAt(0).toUpperCase() + from.slice(1);
  document.getElementById('inc-type').textContent = type === 'video' ? '📹 Incoming video call…' : '📞 Incoming voice call…';
  document.getElementById('incoming-call-ui').classList.add('show');
  document.getElementById('call-overlay').classList.add('open');
  playRingtone();
  triggerIncomingCallNotif(from, type);
}

function hideIncomingCall() {
  document.getElementById('incoming-call-ui').classList.remove('show');
  stopRingtone();
}

function showInCall(peerName, type, statusText) {
  const av = document.getElementById('incall-avatar');
  av.style.background = USERS[peerName]?.color || '#333';
  updateAvatarEl(av, peerName, profiles[peerName]);
  document.getElementById('incall-name').textContent = peerName.charAt(0).toUpperCase() + peerName.slice(1);
  document.getElementById('call-duration').textContent = statusText || '00:00';
  document.getElementById('in-call-ui').classList.add('show');
  document.getElementById('call-overlay').classList.add('open');
}

function startCallTimer() {
  callSeconds = 0;
  clearInterval(callTimerInterval);
  callTimerInterval = setInterval(() => {
    callSeconds++;
    const m = String(Math.floor(callSeconds/60)).padStart(2,'0');
    const s = String(callSeconds%60).padStart(2,'0');
    document.getElementById('call-duration').textContent = `${m}:${s}`;
  }, 1000);
}

/* ── Mute / Camera ── */
function toggleMute() {
  isMuted = !isMuted;
  localStream?.getAudioTracks().forEach(t => t.enabled = !isMuted);
  const btn = document.getElementById('btn-mute');
  btn.textContent = isMuted ? '🔇' : '🎤';
  btn.className   = isMuted ? 'ctrl-btn on' : 'ctrl-btn off';
}
function toggleCamera() {
  isCamOff = !isCamOff;
  localStream?.getVideoTracks().forEach(t => t.enabled = !isCamOff);
  const btn = document.getElementById('btn-cam');
  btn.textContent = isCamOff ? '📵' : '📷';
  btn.className   = isCamOff ? 'ctrl-btn on' : 'ctrl-btn off';
}
function toggleSpeaker() {
  // On mobile browsers, this toggles between earpiece and speaker
  const vid = document.getElementById('remote-video');
  if (vid?.setSinkId) { showToast('Speaker routing not supported in browser'); }
  else { showToast('Speaker routing varies by device'); }
}

/* ── Ringtone (synthesized) ── */
let audioCtx = null;
let ringtoneOscillator = null;
function playRingtone() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine'; osc.frequency.value = 440;
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    osc.start(); ringtoneOscillator = osc;
  } catch(e) {}
}
function stopRingtone() {
  try { ringtoneOscillator?.stop(); ringtoneOscillator = null; } catch(e) {}
}

/* ════════════════════════════════════════
   ████  PUSH NOTIFICATIONS  ████

   How to set up mobile push (when app is closed):
   1. Run: npx web-push generate-vapid-keys
   2. Replace VAPID_PUBLIC_KEY above with your Public Key
   3. Create Supabase Edge Function (see docs/push-notify.ts)
   4. Set env vars in Supabase: VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_EMAIL
   5. Deploy: supabase functions deploy push-notify
   ================================================ */
function urlBase64ToUint8Array(b64) {
  const padding = '='.repeat((4 - b64.length % 4) % 4);
  const base64 = (b64 + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function registerServiceWorker() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.register('./sw.js');
    console.log('SW registered');
    await subscribeToPush(reg);
  } catch(e) { console.warn('SW registration failed (works on HTTPS only):', e.message); }
}

async function subscribeToPush(reg) {
  if (!db || !me) return;
  try {
    const existing = await reg.pushManager.getSubscription();
    const sub = existing || await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
    // Store subscription in profiles so other user can push to us
    await db.from('profiles').update({
      push_sub: JSON.stringify(sub.toJSON()),
      updated_at: new Date().toISOString()
    }).eq('username', me);
    console.log('Push subscription saved');
  } catch(e) { console.warn('Push subscribe failed:', e.message); }
}

async function sendPushToRecipient(messageText) {
  if (!db || !them) return;
  try {
    const { data: profile } = await db.from('profiles').select('push_sub').eq('username', them).single();
    if (!profile?.push_sub) return;
    // Call Supabase Edge Function to send the push
    await fetch(`${SUPABASE_URL}/functions/v1/push-notify`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${SUPABASE_ANON}` },
      body: JSON.stringify({
        subscription: JSON.parse(profile.push_sub),
        title: `${me.charAt(0).toUpperCase()+me.slice(1)} • Ghost Chat`,
        body:  messageText.length > 80 ? messageText.slice(0,80)+'…' : messageText
      })
    });
  } catch(e) { /* Non-critical — in-app notif still works */ }
}

/* ════════════════════════════════════════
   IN-APP NOTIFICATIONS
════════════════════════════════════════ */
function toggleNotifications() {
  notifEnabled = !notifEnabled;
  showToast(notifEnabled ? 'Notifications on' : 'Notifications off');
}

function triggerNotification(m) {
  if (!notifEnabled) return;

  // App is open and focused — user can already see messages; show nothing
  const appVisible = document.visibilityState === 'visible' && document.hasFocus();
  if (appVisible) return;

  const name = m.from.charAt(0).toUpperCase() + m.from.slice(1);
  const text  = m.text || (m.file_name ? `📎 ${m.file_name}` : '');

  // Tab is open but not focused → show in-app banner only
  // Tab is hidden (minimised/closed) → also fire native OS notification
  showNotifBanner(name, text, profiles[m.from], m.from);

  if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
    const n = new Notification(`${name} • Ghost Chat`, {
      body: text, icon: profiles[m.from] || '', tag: 'ghost-chat-msg', renotify: true
    });
    n.onclick = () => { window.focus(); n.close(); };
  }
}

function triggerIncomingCallNotif(from, type) {
  // Calls always show the in-app screen — but only fire OS notification when app is hidden
  const name = from.charAt(0).toUpperCase() + from.slice(1);
  if (!document.hasFocus()) {
    showNotifBanner(name, type === 'video' ? '📹 Incoming video call' : '📞 Incoming voice call', profiles[from], from);
  }
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
    const n = new Notification(`${name} is calling…`, {
      body: type === 'video' ? 'Video call' : 'Voice call', tag: 'ghost-chat-call', renotify: true
    });
    n.onclick = () => { window.focus(); n.close(); };
  }
}

function showNotifBanner(name, text, avUrl, from) {
  const banner = document.getElementById('notif-banner');
  const avEl   = document.getElementById('notif-avatar');
  avEl.style.background = USERS[from]?.color || '#333';
  updateAvatarEl(avEl, from, avUrl);
  document.getElementById('notif-title').textContent = name;
  document.getElementById('notif-text').textContent  = text;
  banner.classList.add('show');
  clearTimeout(notifBannerTimer);
  notifBannerTimer = setTimeout(hideNotifBanner, 4000);
}
function hideNotifBanner() { document.getElementById('notif-banner').classList.remove('show'); }
function handleNotifClick() {
  hideNotifBanner();
  document.getElementById('messages-area').scrollTop = document.getElementById('messages-area').scrollHeight;
}

   AVATAR MODAL
════════════════════════════════════════ */
function openAvatarModal() {
  if (!me) return;
  const bigPrev = document.getElementById('avatar-preview-big');
  updateAvatarEl(bigPrev, me, profiles[me]);
  bigPrev.style.background = USERS[me].color;
  document.getElementById('remove-avatar-btn').style.display = profiles[me] ? '' : 'none';
  document.getElementById('avatar-modal').classList.add('open');
}
function closeAvatarModal() {
  document.getElementById('avatar-modal').classList.remove('open');
  document.getElementById('upload-progress').style.display = 'none';
}
async function handleAvatarSelect(event) {
  const file = event.target.files[0]; event.target.value = '';
  if (!file || !me || !db) return;
  if (file.size > 5*1024*1024) { showToast('Image too large (max 5 MB)'); return; }
  const prog = document.getElementById('upload-progress');
  const bar  = document.getElementById('upload-progress-bar');
  prog.style.display='block'; bar.style.width='20%';
  const path = `${me}_${Date.now()}.${file.name.split('.').pop()}`;
  bar.style.width = '50%';
  const { error: upErr } = await db.storage.from('avatars').upload(path, file, { contentType:file.type, upsert:true });
  if (upErr) { showToast('Upload failed ✗'); prog.style.display='none'; return; }
  bar.style.width = '80%';
  const { data: urlData } = db.storage.from('avatars').getPublicUrl(path);
  const avatarUrl = urlData.publicUrl + '?t=' + Date.now();
  const { error: dbErr } = await db.from('profiles').update({ avatar_url:avatarUrl, updated_at:new Date().toISOString() }).eq('username', me);
  if (dbErr) { showToast('Failed to save ✗'); prog.style.display='none'; return; }
  bar.style.width = '100%';
  profiles[me] = avatarUrl;
  updateAvatarEl(document.getElementById('avatar-preview-big'), me, avatarUrl);
  document.getElementById('remove-avatar-btn').style.display = '';
  document.querySelectorAll('.msg-wrap.me .msg-av').forEach(av => updateAvatarEl(av, me, avatarUrl));
  setTimeout(() => { prog.style.display='none'; closeAvatarModal(); showToast('Profile picture updated ✓'); }, 400);
}
async function removeAvatar() {
  if (!me||!db) return;
  await db.from('profiles').update({ avatar_url:null, updated_at:new Date().toISOString() }).eq('username', me);
  profiles[me]=null;
  updateAvatarEl(document.getElementById('avatar-preview-big'), me, null);
  document.getElementById('remove-avatar-btn').style.display='none';
  document.querySelectorAll('.msg-wrap.me .msg-av').forEach(av => updateAvatarEl(av, me, null));
  showToast('Profile picture removed'); closeAvatarModal();
}

async function handleFileSelect(event) {
  const file = event.target.files[0]; event.target.value='';
  if (!file||!me) return;
  if (file.size>50*1024*1024) { showToast('File too large (max 50 MB)'); return; }
  showToast('⏳ Uploading…', 30000);
  const path = `${Date.now()}_${file.name.replace(/[^a-z0-9._-]/gi,'_')}`;
  const { error: upErr } = await db.storage.from('chat-files').upload(path, file, { contentType:file.type, upsert:false });
  if (upErr) { showToast('Upload failed ✗'); return; }
  const { data: urlData } = db.storage.from('chat-files').getPublicUrl(path);
  const { error: msgErr } = await db.from('messages').insert({ from:me, text:file.name, ts:Date.now(), file_url:urlData.publicUrl, file_name:file.name, file_type:file.type, file_size:file.size });
  showToast(msgErr ? 'Send failed ✗' : 'File sent ✓');
}

function endSession() {
  clearPrivacyTimer();
  cancelRecording();
  endCall(true);
  if (rtChannel) { rtChannel.unsubscribe(); rtChannel=null; }
  if (visibilityObserver) { visibilityObserver.disconnect(); visibilityObserver=null; }
  me=them=null; lastSeen=0; reactionsCache={}; replyState=null;
  cancelReply();
}

/* ════════════════════════════════════════
   UTILITIES
════════════════════════════════════════ */
function getFileIcon(type) {
  if (!type) return '📄';
  if (type.startsWith('video/')) return '🎥';
  if (type.startsWith('audio/')) return '🎵';
  if (type.includes('pdf')) return '📕';
  if (type.includes('zip')||type.includes('rar')) return '🗂';
  if (type.includes('word')||type.includes('doc')) return '📝';
  if (type.includes('sheet')||type.includes('excel')||type.includes('csv')) return '📊';
  return '📄';
}
function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes<1024) return bytes+' B';
  if (bytes<1024*1024) return (bytes/1024).toFixed(1)+' KB';
  return (bytes/1024/1024).toFixed(1)+' MB';
}

const msgInput = document.getElementById('msg-input');
function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }
msgInput.addEventListener('input', () => autoResize(msgInput));
msgInput.addEventListener('keydown', e => { if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(); } });

let toastTimer = null;
function showToast(msg, dur=2500) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), dur);
}

window.addEventListener('beforeunload', () => { if(rtChannel) rtChannel.unsubscribe(); });

/* ════════════════════════════════════════
   REGISTER SERVICE WORKER ON EVERY PAGE LOAD
   (Must be active even before login so push works when app is closed)
════════════════════════════════════════ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
      console.log('SW registered, scope:', reg.scope);

      // If push permission already granted, re-save subscription on every load
      // in case the token was refreshed by the browser
      if ('Notification' in window && Notification.permission === 'granted' && me) {
        subscribeToPush(reg);
      }
    } catch(e) {
      // Works only on HTTPS — on file:// this warning is expected
      console.warn('SW not registered (HTTPS required):', e.message);
    }
  });

  // Listen for push-resubscribe messages from the SW
  // (fires when the browser rotates/refreshes the push token)
  navigator.serviceWorker.addEventListener('message', async event => {
    if (event.data?.type === 'push-resubscribe' && me && db) {
      await db.from('profiles').update({
        push_sub:   JSON.stringify(event.data.sub),
        updated_at: new Date().toISOString()
      }).eq('username', me);
      console.log('Push subscription refreshed in DB');
    }
  });
}
